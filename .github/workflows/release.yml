name: Release

# 打 tag 就在三个平台上各出各的原生包并传到对应 Release。
#
# 为什么必须交给 CI：开发机是 Windows，**没法在本地产出 Linux / macOS 的包**。
# 手工只发 Windows 安装包的话，另外两个平台的用户只能自己从源码编。
on:
  push:
    tags: ["v*"]
  # 给已经发过的 tag 补包用。手工发过 Release 之后想补 Linux / macOS，走这个
  workflow_dispatch:
    inputs:
      tag:
        description: "构建并上传到哪个已存在的 tag（如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    name: 打包 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            glob: "target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage"
          - os: windows-latest
            bundles: nsis
            glob: "target/release/bundle/nsis/*.exe"
          - os: macos-latest
            bundles: dmg
            glob: "target/release/bundle/dmg/*.dmg"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # webkit2gtk-4.1 是 Tauri 2 要的版本（4.0 是 Tauri 1 的）；
      # AppImage 的打包器要 libfuse2 和 patchelf
      - name: 安装 Linux 依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 桌面应用只能经 Tauri CLI 构建，直接 cargo build 出来的是 dev 二进制
      - name: 构建安装包
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # 展开成实际文件列表，顺便确认真的产出了东西——
          # 空手上传会静默成功，那就白跑一趟
          files=$(ls -1 ${{ matrix.glob }} 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::没有产出任何安装包，glob=${{ matrix.glob }}"
            ls -R target/release/bundle || true
            exit 1
          fi
          echo "$files"
          gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
