[package]
name = "litevault-app"
version = "0.1.0"
description = "LiteVault — MC 蓝图库管理器"
edition = "2021"

[lib]
name = "litevault_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
litematic = { path = "../crates/litematic" }
mcassets = { path = "../crates/mcassets" }
render = { path = "../crates/render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rayon = "1"
blake3 = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
